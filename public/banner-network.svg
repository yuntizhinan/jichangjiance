      <stop offset="1" stop-color="#0c9b92"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#88f3df" stop-opacity=".38"/>
      <stop offset="1" stop-color="#88f3df" stop-opacity="0"/>
